              type: string
              format: uuid
    Profile:
      type: object
      description: |
        A CV profile. Nested objects/arrays are stored as JSONB in
        Postgres and round-trip as-is. The canonical document shape is
        in `samples_and_scripts/profile_sample.json` in the repo.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: Owner — set automatically from the auth token, ignored if present in request bodies.
        profile_name:
          type: string
          nullable: true
        profile_description:
          type: string
          nullable: true
        profile_color:
          type: string
          nullable: true
          description: Hex color, e.g. `#1E88E5`.
        icon_asset:
          type: string
          nullable: true
          description: Icon identifier the client maps to a rendered icon (e.g. `briefcase`).
        contact_details:
          type: object
          nullable: true
        about_yourself:
          type: object
          nullable: true
        education_details_list:
          type: array
          items:
            type: object
        work_experience_list:
          type: array
          items:
            type: object
        skills_list:
          type: array
          items:
            type: string
        personal_projects_list:
          type: array
          items:
            type: object
        organization_list:
          type: array
          items:
            type: object
        certificates_list:
          type: array
          items:
            type: object
        languages_list:
          type: array
          items:
            type: object
        interests_list:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        archived:
          type: boolean
          description: |
            `false` for active profiles, `true` for archived. Toggled
            only via `/archiveProfile`.
        updated_at:
          type: string
          format: date-time
    ArchiveProfileRequest:
      type: object
